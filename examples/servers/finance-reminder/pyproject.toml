[project]
name = "mcp-finance-reminder"
version = "0.1.0"
description = "MCP server for recording transactions and sending reminders"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Anthropic, PBC." }]
keywords = ["mcp", "finance", "reminder", "google", "twilio"]
license = { text = "MIT" }
dependencies = [
    "anyio>=4.5",
    "click>=8.1.0",
    "httpx>=0.27",
    "mcp",
    "google-api-python-client",
    "google-auth-oauthlib",
    "twilio>=9.0",
]

[project.scripts]
mcp-finance-reminder = "mcp_finance_reminder.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_finance_reminder"]

[tool.pyright]
include = ["mcp_finance_reminder"]
venvPath = "."
venv = ".venv"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.uv]
dev-dependencies = ["pyright>=1.1.378", "pytest>=8.3.3", "ruff>=0.6.9"]
